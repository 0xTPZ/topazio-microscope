name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile run_app.py topazio_microscope/app.py topazio_microscope/image/processing.py
      - run: python -c "from tests.test_processing import test_focus_and_profiles; test_focus_and_profiles(); print('processing tests passed')"
