name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile run_app.py topazio_microscope/app.py topazio_microscope/app_v02.py topazio_microscope/capture/worker.py topazio_microscope/capture/recording.py topazio_microscope/inspection/annotations.py topazio_microscope/vision/metrics.py topazio_microscope/vision/alignment.py topazio_microscope/analysis/assistant.py topazio_microscope/analysis/providers.py topazio_microscope/rules/repair.py topazio_microscope/models/repair.py topazio_microscope/reports/repair.py topazio_microscope/ui/roi_canvas.py
      - run: python -c "from tests.test_processing import test_focus_and_profiles; test_focus_and_profiles(); from tests.test_annotations_and_planning import test_annotation_layers_coordinates_and_roundtrip; test_annotation_layers_coordinates_and_roundtrip(); from tests.test_worker_and_recording import test_worker_lifecycle_without_camera,test_recording_dimensions_with_zoom; test_worker_lifecycle_without_camera(); test_recording_dimensions_with_zoom(); from tests.test_repair_assistant import test_roi_metrics_and_explicit_guidance,test_comparison_overlay_and_difference,test_report_roundtrip_and_manual_result,test_optional_model_provider_is_offline_and_explicit,test_assistant_interface_initialization_and_analysis,test_orb_alignment_with_sparse_descriptors,test_assistant_report_initialized_and_results_replaced,test_roi_canvas_repeated_frames_with_selection; test_roi_metrics_and_explicit_guidance(); test_comparison_overlay_and_difference(); test_report_roundtrip_and_manual_result(); test_optional_model_provider_is_offline_and_explicit(); test_assistant_interface_initialization_and_analysis(); test_orb_alignment_with_sparse_descriptors(); test_assistant_report_initialized_and_results_replaced(); test_roi_canvas_repeated_frames_with_selection(); print('headless tests passed')"
      - run: python tests/layout_responsive.py
